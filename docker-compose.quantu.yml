services:
  quantu-mysql:
    image: mysql:8.4
    container_name: quantu-mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: quantu_local
      MYSQL_ROOT_PASSWORD: ${QUANTU_MYSQL_ROOT_PASSWORD:?set QUANTU_MYSQL_ROOT_PASSWORD}
    volumes:
      - quantu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  quantu_mysql_data:
